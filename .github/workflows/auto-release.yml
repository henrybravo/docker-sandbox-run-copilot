name: Create Release on Version Update

on:
  push:
    branches:
      - main
    paths:
      - '.copilot-version'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read new version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < .copilot-version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check-tag
        run: |
          git fetch --tags
          if git tag -l "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} does not exist, creating release."
          fi

      - name: Create tag and release
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(printf "## What's Changed\n\nUpdated GitHub Copilot CLI to version \`%s\`.\n\nSee upstream release notes at: https://github.com/github/copilot-cli/releases/tag/%s" "$RELEASE_VERSION" "$RELEASE_TAG")
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --notes "$NOTES" \
            --latest
          echo "Release $RELEASE_TAG created successfully."
